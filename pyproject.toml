[project]
name = "datasette-otel-file-exporter"
version = "0.1.0a1"
description = "Export Datasette's OpenTelemetry spans to files - gzipped NDJSON or Parquet, a local directory or object storage. No collector, no backend"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a41",
    "opentelemetry-sdk>=1.37",
]

[project.optional-dependencies]
# format: parquet
parquet = ["pyarrow>=17"]
# url: s3:// gs:// az:// (tested against obstore 0.11.1)
obstore = ["obstore>=0.11"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-otel-file-exporter"
Changelog = "https://github.com/datasette/datasette-otel-file-exporter/releases"
Issues = "https://github.com/datasette/datasette-otel-file-exporter/issues"
CI = "https://github.com/datasette/datasette-otel-file-exporter/actions"

[project.entry-points.datasette]
otel_file_exporter = "datasette_otel_file_exporter"

[dependency-groups]
# Both extras, so the suite covers every format and store
dev = [
    "pytest",
    "pytest-asyncio",
    "duckdb",
    "pyarrow>=17",
    "obstore>=0.11",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]

[tool.setuptools.packages.find]
include = ["datasette_otel_file_exporter*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# pyflakes/pycodestyle errors, import order, pyupgrade, bugbear, ruff's own.
# No BLE/S/TRY: telemetry deliberately swallows broad exceptions rather
# than take the app down.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ty.environment]
python-version = "3.10"
